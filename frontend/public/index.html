<!doctype html>
<html lang="cs">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
        <meta name="theme-color" content="#1e3a5f" />
        <meta name="color-scheme" content="light" />
        <meta
            name="description"
            content="Bankovnictví – konsolidovaná datová platforma a veřejná databáze finančních a ekonomických ukazatelů."
        />
        <meta name="application-name" content="Bankovnictví" />
        <meta name="keywords" content="bankovnictví, data, statistiky, ČNB, Eurostat, ekonomické ukazatele" />
        <meta name="author" content="Bankovnictví" />
        <meta name="format-detection" content="telephone=no" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:locale" content="cs_CZ" />
        <meta property="og:site_name" content="Bankovnictví" />
        <meta property="og:title" content="Bankovnictví – konsolidovaná datová platforma" />
        <meta
            property="og:description"
            content="Vyhledávání a prohlížení dat napříč zdroji (ARAD, Eurostat, ČSÚ, ECB, FRED a další)."
        />
        <meta property="og:image" content="%PUBLIC_URL%/favicon.png" />

        <!-- Twitter / X -->
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:title" content="Bankovnictví – konsolidovaná datová platforma" />
        <meta
            name="twitter:description"
            content="Vyhledávání a prohlížení dat napříč zdroji (ARAD, Eurostat, ČSÚ, ECB, FRED a další)."
        />
        <meta name="twitter:image" content="%PUBLIC_URL%/favicon.png" />

        <!-- Apple / PWA-lite -->
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="apple-mobile-web-app-status-bar-style" content="default" />
        <meta name="apple-mobile-web-app-title" content="Bankovnictví" />

        <link rel="icon" href="%PUBLIC_URL%/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="%PUBLIC_URL%/favicon.png" type="image/png" sizes="any" />
        <link rel="apple-touch-icon" href="%PUBLIC_URL%/favicon.png" />
        <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@600&display=swap" rel="stylesheet" />
        <title>Bankovnictví – konsolidovaná datová platforma</title>
        <script>window.addEventListener("error",function(e){if(e.error instanceof DOMException&&e.error.name==="DataCloneError"&&e.message&&e.message.includes("PerformanceServerTiming")){e.stopImmediatePropagation();e.preventDefault()}},true);</script>
    </head>
    <body>
        <noscript>You need to enable JavaScript to run this app.</noscript>
        <div id="root"></div>
    </body>
</html>
