services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: bankintel
      POSTGRES_USER: bankintel
      POSTGRES_PASSWORD: bankintel
    ports:
      - "5432:5432"
    volumes:
      - bankintel_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bankintel -d bankintel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  bankintel_pg:
