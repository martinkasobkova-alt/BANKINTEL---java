# Render Blueprint — BankIntel v2 backend
# Persistent disk required for FTS catalog index (classic_catalog_search.sqlite + per-source JSONL).
# Populate /data/catalog_search_indexes via index build/mirror before first deploy, or mount
# a pre-built snapshot from object storage during startup.

services:
  - type: web
    name: bankintel-api
    runtime: docker
    dockerfilePath: ./backend-java/Dockerfile
    dockerContext: ./backend-java
    plan: starter
    region: frankfurt
    healthCheckPath: /actuator/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: bankintel-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CATALOG_SEARCH_INDEX_DIR
        value: /data/catalog_search_indexes
      - key: CATALOG_SEARCH_METADATA_DIR
        value: /data/catalog_search_metadata
      - key: CLASSIC_CATALOG_FTS_DB
        value: /data/catalog_search_indexes/classic_catalog_search.sqlite
      - key: SEARCH_ENGINE_VERSION
        value: v2
      - key: SEARCH_CATALOG_INDEX
        value: sidecar
      - key: SEARCH_SEMANTIC_RETRIEVAL_ENABLED
        value: "false"
      - key: SEARCH_CATALOG_SIDECAR_DIR
        value: /data/search_v2_sidecar
      - key: SEARCH_CATALOG_SIDECAR_FTS_DB
        value: /data/search_v2_sidecar/search_v2_sidecar.sqlite
      # Optional — HTTP URL to pre-built FTS snapshot (.zip or .gz); downloaded on first boot if sqlite missing
      # - key: FTS_INDEX_SNAPSHOT_URL
      #   value: https://storage.example.com/classic_catalog_search.sqlite.gz
      - key: BANKINTEL_DATA_DIR
        value: /data
      - key: COOKIE_SECURE
        value: "true"
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      # Native-Java Eurostat refresh of manager_series_cache (nightly, 04:00 UTC) — live-verified
      # 2026-08-07: 8,713 targets, ~80% loaded, written to the real collection in ~4.5 min. Still
      # requires BANKINTEL_SCHEDULER_LEADER below to actually fire — see that flag's own comment.
      - key: MANAGER_SERIES_CACHE_JAVA_REFRESH_ENABLED
        value: "1"
      # Set on exactly one replica when scaling horizontally — safe here: plan is "starter"
      # (single instance, no horizontal scaling configured).
      - key: BANKINTEL_SCHEDULER_LEADER
        value: "1"
    disk:
      name: bankintel-fts-index
      mountPath: /data
      # Naměřeno nad `data/` 2026-09-01, po přesunu mirror dat z referenčního Python repa:
      #   catalog_search_indexes         11,8 GB   (z toho classic sqlite 8,9)
      #   search_v2_sidecar              12,7 GB   (bez vector částí, viz níž)
      #   oecd4 offline mirror            4,1 GB
      #   ostatní JSON (macro snapshot,   1,2 GB
      #     segment_series_assignments …)
      #   mirror CSV (eba, eiopa, entsoe, 0,1 GB
      #     gie, acea, financial_markets)
      #   ---------------------------------------
      #   nutné minimum                  29,9 GB
      #
      # K tomu vector-embedding-cache.sqlite + vector-lucene = 4,8 GB. Ty gatuje
      # SEARCH_VECTOR_RETRIEVAL_ENABLED (SearchVectorProperties#enabled, default "false"),
      # NE SEARCH_SEMANTIC_RETRIEVAL_ENABLED níž — to je jiný flag. Tady se nenastavuje,
      # takže platí default false a těch 4,8 GB se nepoužije. Pozor: v dev .env je
      # SEARCH_VECTOR_RETRIEVAL_ENABLED=true, takže prod hledá jinak než dev; kdo to tu
      # zapne, připočte 4,8 GB (klid 34,7 GB, špička 43,6 GB).
      #
      # Noční přestavba indexu (02:30 UTC, ClassicCatalogFtsIndexBuilder) staví do
      # `classic_catalog_search.tmp.sqlite` VEDLE stávajícího a teprve pak ho přejmenuje.
      # Po dobu přestavby leží na disku obě kopie:
      #   29,9 GB + 8,9 GB = 38,8 GB špička   (43,6 GB s vector částmi)
      #
      # Dřív tu bylo 20 GB, což nestačilo ani na klidový stav — instance padala právě v noci
      # při té přestavbě. 60 GB drží špičku i s rezervou na růst indexu.
      # Pozor: Render umí disk jen zvětšit, ne zmenšit.
      #
      # DŮLEŽITÉ: na `/data` musí být i mirror CSV a oecd4 — nejsou v gitu ani v Docker image.
      # Kompletní seznam v backend-java/docs/DEPLOY_DATA.md; bez nich hlásí /api/health/platform
      # mirrors_available < mirrors_total a Manager Explorer u těch zdrojů nic nenačte.
      sizeGB: 60

databases:
  - name: bankintel-db
    plan: starter
    region: frankfurt
    databaseName: bankintel
    user: bankintel
